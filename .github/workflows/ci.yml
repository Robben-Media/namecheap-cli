name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run fmt-check
        run: make fmt-check

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build (CGO enabled for keyring)
        run: CGO_ENABLED=1 go build -o bin/namecheap-cli ./cmd/namecheap

      - name: Probe native macOS empty-keyring status
        timeout-minutes: 1
        shell: bash
        env:
          NAMECHEAP_CLI_KEYRING_BACKEND: keychain
        run: |
          ./bin/namecheap-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert all(s[k] == "missing" for k in ("api_key", "api_user", "client_ip"))'

      - name: Test headless encrypted credential storage
        timeout-minutes: 1
        shell: bash
        env:
          NAMECHEAP_CLI_KEYRING_BACKEND: file
          NAMECHEAP_CLI_KEYRING_PASS: ci-only-dummy-password
        run: |
          echo "testkey" | ./bin/namecheap-cli auth set-key --stdin
          ./bin/namecheap-cli auth set-user ci-dummy-user
          ./bin/namecheap-cli auth set-ip 192.0.2.1
          ./bin/namecheap-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert all(s[k] == "stored" for k in ("api_key", "api_user", "client_ip"))'
          ./bin/namecheap-cli auth remove
          ./bin/namecheap-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert all(s[k] == "missing" for k in ("api_key", "api_user", "client_ip"))'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/namecheap-cli.exe ./cmd/namecheap

      - name: Test keyring
        run: |
          "testkey" | .\bin\namecheap-cli.exe auth set-key --stdin
          .\bin\namecheap-cli.exe auth status
